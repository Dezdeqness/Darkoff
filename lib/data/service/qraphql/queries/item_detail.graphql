query DarkoffItemDetail($id: ID!, $language: LanguageCode, $gameMode: GameMode) {
  item(id: $id, lang: $language, gameMode: $gameMode) {
    id
    bsgCategoryId
    name
    shortName
    normalizedName
    description
    basePrice
    avg24hPrice
    low24hPrice
    high24hPrice
    changeLast48h
    changeLast48hPercent
    lastLowPrice
    lastOfferCount
    width
    height
    weight
    backgroundColor
    iconLink
    baseImageLink
    image512pxLink
    image8xLink
    wikiLink
    updated
    types
    categories {
      id
      name
      normalizedName
    }
    handbookCategories {
      id
    }
    sellFor {
      ...ItemPriceFragment
    }
    buyFor {
      ...ItemPriceFragment
    }
    containsItems {
      count
      item {
        id
      }
    }
    properties {
      __typename
      ... on ItemPropertiesAmmo {
        caliber
        damage
        projectileCount
        penetrationPower
        armorDamage
        fragmentationChance
        ammoType
      }
      ... on ItemPropertiesArmor {
        class
        material {
          id
          name
        }
        zones
        durability
        ergoPenalty
        speedPenalty
        turnPenalty
        armorSlots {
          ...ArmorSlotFragment
        }
      }
      ... on ItemPropertiesArmorAttachment {
        class
        material {
          id
          name
        }
        zones
        durability
        ergoPenalty
        speedPenalty
        turnPenalty
      }
      ... on ItemPropertiesBackpack {
        capacity
        grids {
          ...GridFragment
        }
        speedPenalty
        turnPenalty
        ergoPenalty
      }
      ... on ItemPropertiesBarrel {
        ergonomics
        recoilModifier
        slots {
          ...SlotFragment
        }
      }
      ... on ItemPropertiesChestRig {
        class
        material {
          id
          name
        }
        zones
        durability
        capacity
        speedPenalty
        turnPenalty
        ergoPenalty
        grids {
          ...GridFragment
        }
        armorSlots {
          ...ArmorSlotFragment
        }
      }
      ... on ItemPropertiesContainer {
        capacity
        grids {
          ...GridFragment
        }
      }
      ... on ItemPropertiesFoodDrink {
        energy
        hydration
        units
        stimEffects {
          ...StimEffectFragment
        }
      }
      ... on ItemPropertiesGlasses {
        class
        durability
        blindnessProtection
        ergoPenalty
        material {
          id
          name
        }
      }
      ... on ItemPropertiesGrenade {
        type
        fuse
        maxExplosionDistance
        fragments
      }
      ... on ItemPropertiesHeadphone {
        ambientVolume
        distortion
        distanceModifier
      }
      ... on ItemPropertiesHelmet {
        class
        material {
          id
          name
        }
        headZones
        durability
        ergoPenalty
        speedPenalty
        turnPenalty
        deafening
        blocksHeadset
        blindnessProtection
        ricochetY
        slots {
          ...SlotFragment
        }
      }
      ... on ItemPropertiesKey {
        uses
      }
      ... on ItemPropertiesMagazine {
        ergonomics
        capacity
        loadModifier
        ammoCheckModifier
        malfunctionChance
        recoilModifier
      }
      ... on ItemPropertiesMedicalItem {
        uses
        useTime
        cures
      }
      ... on ItemPropertiesMedKit {
        hitpoints
        useTime
        maxHealPerUse
        cures
        hpCostLightBleeding
        hpCostHeavyBleeding
      }
      ... on ItemPropertiesPainkiller {
        uses
        useTime
        painkillerDuration
        cures
        energyImpact
        hydrationImpact
      }
      ... on ItemPropertiesPreset {
        baseItem {
          id
          name
          shortName
          normalizedName
          properties {
            ... on ItemPropertiesWeapon {
              defaultPreset {
                id
              }
            }
          }
        }
        ergonomics
        recoilVertical
        recoilHorizontal
      }
      ... on ItemPropertiesResource {
        units
      }
      ... on ItemPropertiesScope {
        ergonomics
        recoilModifier
        zoomLevels
      }
      ... on ItemPropertiesStim {
        cures
        useTime
        stimEffects {
          ...StimEffectFragment
        }
      }
      ... on ItemPropertiesSurgicalKit {
        uses
        useTime
        cures
        minLimbHealth
        maxLimbHealth
      }
      ... on ItemPropertiesWeapon {
        caliber
        effectiveDistance
        ergonomics
        fireModes
        fireRate
        recoilVertical
        recoilHorizontal
        sightingRange
        recoilAngle
        recoilDispersion
        convergence
        cameraRecoil
        slots {
          ...SlotFragment
        }
        defaultPreset {
          id
        }
        presets {
          id
        }
      }
      ... on ItemPropertiesWeaponMod {
        ergonomics
        recoilModifier
        accuracyModifier
        slots {
          ...SlotFragment
        }
      }
      ... on ItemPropertiesMelee {
        slashDamage
        stabDamage
        hitRadius
      }
      ... on ItemPropertiesNightVision {
        intensity
        noiseIntensity
        noiseScale
        diffuseIntensity
      }
      ... on ItemPropertiesHeadwear {
        slots {
          ...SlotFragment
        }
      }
    }
  }
}
