query DarkoffAmmo($language: LanguageCode, $gameMode: GameMode) {
  ammo(lang: $language, gameMode: $gameMode) {
    item {
      id
      name
      shortName
      iconLink
      avg24hPrice
    }
    caliber
    damage
    penetrationPower
    armorDamage
    fragmentationChance
    tracer
    ammoType
  }
}
